<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A premium mobile portfolio app for a developer — projects, skills, services and a direct line to the owner.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Matches the Flutter theme so there is no white flash on load -->
  <meta name="theme-color" content="#06080F">
  <title>Portfolio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #06080F;
      color: #EEF2F8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(620px 420px at 18% -5%, rgba(110,168,255,.20), transparent 62%),
        radial-gradient(560px 380px at 88% 4%, rgba(167,139,250,.16), transparent 58%),
        #06080F;
      transition: opacity .32s ease;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    .mono {
      width: 74px; height: 74px; border-radius: 22px;
      display: grid; place-items: center;
      font-weight: 700; font-size: 26px; letter-spacing: -.02em; color: #EAF1FF;
      background: linear-gradient(140deg, rgba(110,168,255,.28), rgba(167,139,250,.28));
      border: 1px solid rgba(110,168,255,.34);
      box-shadow: 0 18px 44px rgba(0,0,0,.55);
      animation: pulse 2.1s ease-in-out infinite;
    }
    .label { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #7A849C; }
    @keyframes pulse { 0%,100% { transform: translateY(0); opacity: .92; } 50% { transform: translateY(-5px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .mono { animation: none; } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mono">SZ</div>
    <div class="label">Loading portfolio</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Fade the boot splash out once Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('hidden');
      setTimeout(function () { boot.remove(); }, 380);
    });
  </script>
</body>
</html>
