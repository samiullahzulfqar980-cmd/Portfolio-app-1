name: portfolio_app
description: "A premium mobile portfolio app for a developer, built with Flutter and Supabase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend: authentication, Postgres, storage
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2

  # State management + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Platform integrations
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/projects/
    - assets/branding/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
